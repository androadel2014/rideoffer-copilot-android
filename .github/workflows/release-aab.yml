name: Release AAB (Google Play internal testing)

on:
  workflow_dispatch:
    inputs:
      builder:
        description: "eas = Expo cloud build + submit; gradle = build on GitHub runner + upload"
        required: true
        default: eas
        type: choice
        options: [eas, gradle]
  push:
    tags: ['v*']

jobs:
  eas:
    if: github.event_name == 'push' || inputs.builder == 'eas'
    name: EAS build + submit to internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install --no-audit --no-fund
      - run: npm test && npm run audit:network
      - name: Write Play service account key
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > google-service-account.json
      - name: Build AAB and submit to internal testing
        run: eas build --platform android --profile production --non-interactive --auto-submit

  gradle:
    if: github.event_name == 'workflow_dispatch' && inputs.builder == 'gradle'
    name: Gradle bundleRelease + upload to internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm test && npm run audit:network
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Decode upload keystore
        run: echo '${{ secrets.UPLOAD_KEYSTORE_BASE64 }}' | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB
        working-directory: android
        env:
          ROC_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ROC_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          ROC_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ROC_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ROC_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rideoffer-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Upload to Google Play (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rideoffercopilot.android
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
