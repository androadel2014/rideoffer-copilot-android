name: Release AAB (Google Play internal testing)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      builder:
        description: "eas = Expo cloud build + submit; gradle = build on GitHub runner + upload"
        required: true
        default: eas
        type: choice
        options: [eas, gradle]
  push:
    tags: ['v*']
    branches: [claude-build-v1]
    paths: ['.github/workflows/release-aab.yml']

jobs:
  eas:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.builder == 'eas')
    name: EAS build + submit to internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install --no-audit --no-fund
      - run: npm test && npm run audit:network
      - name: Write Play service account key
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > google-service-account.json
      - name: Build AAB and submit to internal testing
        run: eas build --platform android --profile production --non-interactive --auto-submit

  gradle:
    if: (github.event_name == 'workflow_dispatch' && inputs.builder == 'gradle') || (github.event_name == 'push' && github.ref == 'refs/heads/claude-build-v1')
    name: Gradle bundleRelease + upload to internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm test && npm run audit:network
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Decode upload keystore
        run: echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB
        working-directory: android
        env:
          ROC_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ROC_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ROC_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ROC_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon
      # Account Actions artifact storage is at 100% quota — keep non-fatal
      # (same workaround as the Fakarny repo) and publish via release asset.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rideoffer-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Publish AAB as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-builds >/dev/null 2>&1 || gh release create ci-builds --title "CI builds" --notes "Rolling CI build assets"
          gh release upload ci-builds android/app/build/outputs/bundle/release/app-release.aab --clobber
      # NOTE: Play Console upload is intentionally NOT done in CI (done manually).
