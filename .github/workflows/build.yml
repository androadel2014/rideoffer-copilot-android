name: Build RideOffer (debug APK + unit tests)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: rideoffer-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default package list includes the legacy 'tools' package, which no
          # longer exists in the SDK repository and fails the step.
          packages: platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK platform 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13 (for wrapper bootstrap only)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bootstrap official Gradle wrapper JAR (checksum-verified)
        run: |
          set -euo pipefail
          # Official Gradle 8.13 gradle-wrapper.jar SHA-256, as recorded in
          # gradle/wrapper/OFFICIAL_JAR_SHA256.txt (source: gradle.org/release-checksums).
          EXPECTED="81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            GEN="$(mktemp -d)/gen"
            mkdir -p "$GEN"
            printf 'rootProject.name = "wrapgen"\n' > "$GEN/settings.gradle.kts"
            (cd "$GEN" && gradle wrapper --gradle-version 8.13 --distribution-type bin)
            cp "$GEN/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          fi
          GOT="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          echo "gradle-wrapper.jar SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "ERROR: wrapper JAR checksum mismatch (expected $EXPECTED)" >&2
            exit 1
          fi
          echo "Wrapper JAR checksum verified against official Gradle 8.13 checksum."

      - name: Verify source and pinned versions
        run: python3 Scripts/check_source.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RideOffer-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideOffer-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 14
