name: Screenshots RideOffer (one-off, emulator)

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK platform 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13 (for wrapper bootstrap only)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bootstrap official Gradle wrapper JAR (checksum-verified)
        run: |
          set -euo pipefail
          EXPECTED="81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            GEN="$(mktemp -d)/gen"
            mkdir -p "$GEN"
            printf 'rootProject.name = "wrapgen"\n' > "$GEN/settings.gradle.kts"
            (cd "$GEN" && gradle wrapper --gradle-version 8.13 --distribution-type bin)
            cp "$GEN/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          fi
          GOT="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          echo "gradle-wrapper.jar SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "ERROR: wrapper JAR checksum mismatch (expected $EXPECTED)" >&2
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: bash scripts/shots/run.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideOffer-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn
