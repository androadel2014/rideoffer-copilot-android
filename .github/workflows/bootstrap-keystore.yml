name: Bootstrap upload keystore (one-time)

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate upload keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap-out
          STORE_PASS="$(openssl rand -base64 24 | tr -d '\n')"
          KEY_PASS="$(openssl rand -base64 24 | tr -d '\n')"
          keytool -genkeypair -v \
            -keystore bootstrap-out/upload-keystore.jks \
            -storetype JKS \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Andrew Metry, O=Andrew Metry, C=US" > /dev/null 2>&1
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=upload\n' "$STORE_PASS" "$KEY_PASS" > bootstrap-out/credentials.txt
          ls -l bootstrap-out/

      - name: Upload keystore bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: rideoffer-keystore-bootstrap
          path: bootstrap-out/
          retention-days: 7
